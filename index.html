<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Task Manager</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <script>
  // Agar user logged in nahi hai, toh login page pe bhejo
  if (!localStorage.getItem('currentUser')) {
    window.location.href = 'login.html';
  }
</script>
  <div class="container">
    <h1>📋 Task Manager</h1>
    <div class="user-bar">
  <span id="welcomeUser">👤 User</span>
  <button onclick="logout()" class="logout-btn">🚪 Logout</button>
</div>
    <button id="themeToggle" class="theme-btn" onclick="toggleTheme()">🌙 Dark Mode</button>
    <div class="stats">
  <span>Total: <b id="totalCount">0</b></span>
  <span>✅ Completed: <b id="completedCount">0</b></span>
  <span>⏳ Pending: <b id="pendingCount">0</b></span>
</div>
    <!-- Task add karne ka form -->
    <div class="task-form">
      <input type="text" id="taskInput" placeholder="Task likho..." />
      <select id="priority">
        <option value="low">Low</option>
        <option value="medium" selected>Medium</option>
        <option value="high">High</option>
      </select>
      <input type="date" id="deadline" />
      <select id="category">
  <option value="general">📁 General</option>
  <option value="work">💼 Work</option>
  <option value="personal">🏠 Personal</option>
  <option value="study">📚 Study</option>
</select>
      <button onclick="addTask()">Add Task</button>
    </div>
  <div class="search-box">
  <input type="text" id="searchInput" placeholder="🔍 Task search karo..." oninput="searchTasks()" />
</div>
    <!-- Filter buttons -->
    <div class="filters">
      <button onclick="filterTasks('all')">All</button>
      <button onclick="filterTasks('pending')">Pending</button>
      <button onclick="filterTasks('completed')">Completed</button>
    </div>
        <!-- Export / Import buttons -->
    <div class="data-actions">
      <button onclick="exportTasks()">📤 Export</button>
      <button onclick="document.getElementById('importFile').click()">📥 Import</button>
      <input type="file" id="importFile" accept=".json" style="display:none;" onchange="importTasks(event)" />
    </div>

    <!-- Task list yahan dikhegi -->
    <ul id="taskList"></ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
